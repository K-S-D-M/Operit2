name: Windows Release Build

on:
  workflow_dispatch:
    inputs:
      products:
        description: "Release products to build"
        required: false
        default: "all"
        type: choice
        options:
          - "app"
          - "cli"
          - "all"
      cli_arches:
        description: "Windows CLI architectures"
        required: false
        default: "all"
        type: choice
        options:
          - "host"
          - "all"
          - "x86_64"
          - "aarch64"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install FVM
        shell: pwsh
        run: |
          dart pub global activate fvm $env:FVM_VERSION
          "$env:APPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        shell: pwsh
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Install LLVM
        shell: pwsh
        run: choco install llvm --no-progress --limit-output --yes

      - name: Check build environment
        shell: pwsh
        run: python tools/build_scripts/check_build_environment.py --products "${{ inputs.products }}" --cli-arches "${{ inputs.cli_arches }}" --github-runner

      # hook/build.dart 与 windows/runner/CMakeLists.txt 的 sync_operit_plugins
      # 都硬编码 .venv/Scripts/python.exe，CI runner 没有现成 venv，先补齐。
      - name: Prepare Python virtualenv
        shell: pwsh
        run: |
          $repoRoot = (Resolve-Path '.').Path
          $venvPython = Join-Path $repoRoot ".venv\Scripts\python.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $venvPython) | Out-Null
          $python = (Get-Command python).Source
          Copy-Item $python $venvPython -Force
          & $venvPython --version
          Write-Host "Prepared .venv Python at $venvPython"
      # sync_plugin_packages.py 需要 .ci-tools 下的 tsc 和 corepack pnpm。
      - name: Prepare TypeScript and pnpm dependencies
        shell: pwsh
        run: |
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          if ($LASTEXITCODE -ne 0) { throw "npm install typescript failed" }
          corepack enable pnpm
          if ($LASTEXITCODE -ne 0) { throw "corepack enable pnpm failed" }
          corepack prepare pnpm@10.7.0 --activate
          if ($LASTEXITCODE -ne 0) { throw "corepack prepare pnpm failed" }
          Push-Location plugins/packages/buildin/workflow
          try {
            corepack pnpm install --frozen-lockfile
            if ($LASTEXITCODE -ne 0) { throw "corepack pnpm install failed" }
          } finally {
            Pop-Location
          }
          Write-Host "TypeScript and pnpm dependencies prepared"

      - name: Build and package Windows app
        if: inputs.products != 'cli'
        shell: pwsh
        run: python tools/build_scripts/build_flutter_windows.py --enforce-lockfile

      - name: Build and package Windows CLI
        if: inputs.products != 'app'
        shell: pwsh
        run: python tools/build_scripts/build_cli_windows.py --arches "${{ inputs.cli_arches }}"

      - name: Upload Windows app artifact
        if: inputs.products != 'cli'
        uses: actions/upload-artifact@v4
        with:
          name: operit2-windows-app-${{ github.sha }}
          path: tools/release/dist/operit2-app-windows-x86_64-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows CLI artifacts
        if: inputs.products != 'app'
        uses: actions/upload-artifact@v4
        with:
          name: operit2-windows-cli-${{ github.sha }}
          path: tools/release/dist/operit2-cli-windows-*.zip
          if-no-files-found: error
          retention-days: 14
